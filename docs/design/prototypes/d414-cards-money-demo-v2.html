<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-414 演示 · 卡与钱（第二轮）</title>
<link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/assets/admin.css?v=31">
<link rel="stylesheet" href="/admin/assets/workbench.css?v=28">
<link rel="stylesheet" href="/admin/assets/cards.css?v=8">
<style>
/* ---- 演示外壳（不是产品的一部分） ---- */
.demo-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:0 0 10px;padding:9px 12px;border:1px dashed var(--wb-bd);border-radius:11px;background:var(--wb-s);font-size:12.5px;color:var(--wb-t2)}
.demo-bar b{color:var(--wb-t)}
.demo-bar .opt{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--wb-s3)}
.demo-bar .opt button{border:0;background:none;padding:4px 12px;border-radius:6px;font:inherit;font-size:12.5px;color:var(--wb-t2);cursor:pointer}
.demo-bar .opt button[aria-pressed="true"]{background:var(--wb-s);color:var(--wb-a-ink);font-weight:600;box-shadow:0 1px 2px hsla(176,25%,10%,.12)}
.demo-note{margin:0 0 12px;padding:9px 13px;border:1px dashed var(--wb-bd);border-radius:10px;background:var(--wb-s);font-size:12.5px;color:var(--wb-t2);line-height:1.7}
.demo-note b{color:var(--wb-t)}
.demo-muted{color:var(--wb-t3);font-size:12.5px;margin:0}

/* ================= 提议：卡与钱（第二轮） =================
   只用 DESIGN_SYSTEM.md 的令牌与阶梯。共同点：
   ① 「Plus 还能接 N 单」进标题行，不另占一行；去掉「只读」（这块有刷新 / 更新登录按钮，本来就不是只读）
   ② 出问题只在卡台名后面跟一小段颜色字（悬停看详情），不单独占行；总闸关放进标题行右侧
   ③ 不写「自动补 / 需人工开」 */
.workbench .cm-ch{align-items:flex-end}
.workbench .cm-title{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.workbench .cm-title .cm-n{font-family:var(--wb-fm);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--wb-t)}
.workbench .cm-title.is-zero .cm-n{color:var(--wb-warn)}
.workbench .cm-chr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.workbench .cm-sub{font-size:12px;color:var(--wb-t3);white-space:nowrap}
.workbench .cm-sub i{font-style:normal;font-family:var(--wb-fm);font-weight:600;color:var(--wb-t2)}
.workbench .cm-st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;cursor:help}
.workbench .cm-st .wb-d{width:7px;height:7px;border-radius:1px;flex:none}
.workbench .cm-st.is-danger{color:var(--wb-danger)} .workbench .cm-st.is-danger .wb-d{background:var(--wb-danger)}
.workbench .cm-wal{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.workbench .cm-wal .wb-mono{font-size:13px;font-weight:600;color:var(--wb-t)}
.workbench .cm-wal .cm-when{font-size:12px;color:var(--wb-t3)}
.workbench .cm-foot{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 2px 0;font-size:12px;color:var(--wb-t3)}
.workbench .cm-foot b{font-family:var(--wb-fm);font-weight:600;color:var(--wb-t2)}
.workbench .cm-num{font-family:var(--wb-fm);font-size:13px;font-weight:600;color:var(--wb-t)}
.workbench .cm-num.is-dim{color:var(--wb-t3);font-weight:400}
.workbench .cm-unit{font-size:12px;color:var(--wb-t3)}   /* 不用 <small>：admin.css 有 td small{display:block} */
.workbench .cm-spent0{font-size:12px;color:var(--wb-t3)}

/* 甲 · 一张表 */
.workbench .cm-tbl tbody tr{cursor:default}
.workbench .cm-tbl tbody tr:hover{background:none}
.workbench .cm-tbl th.r,.workbench .cm-tbl td.r{text-align:right;white-space:nowrap;width:76px}
.workbench .cm-tbl td.cm-name{white-space:nowrap}
.workbench .cm-tbl td.cm-name b{font-size:13px;margin-right:8px}

/* 乙 · 每台一块 */
.workbench .cm-rigs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.workbench .cm-rig{display:grid;gap:8px;padding:13px 14px;border:1px solid var(--wb-bd);border-radius:11px;background:var(--wb-s2)}
.workbench .cm-rhead{display:flex;align-items:center;gap:8px;white-space:nowrap}
.workbench .cm-rhead b{font-size:13px;color:var(--wb-t)}
.workbench .cm-rhead .cm-spentr{margin-left:auto;font-size:12px;color:var(--wb-t3)}
.workbench .cm-rhead .cm-spentr .wb-mono{color:var(--wb-t2);font-size:12px}
.workbench .cm-two{display:flex;gap:16px;align-items:baseline;white-space:nowrap}
.workbench .cm-two span{font-size:12px;color:var(--wb-t2)}
.workbench .cm-two .cm-big2{font-family:var(--wb-fm);font-size:16px;font-weight:600;color:var(--wb-t);margin:0 2px 0 4px}
.workbench .cm-two .cm-big2.is-dim{color:var(--wb-t3);font-weight:400}

/* 丙 · 左边大数字，右边明细 */
.workbench .cm-split{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:stretch}
.workbench .cm-kpi{display:grid;gap:4px;align-content:center;padding:13px 14px;border:1px solid var(--wb-bd);border-radius:11px;background:var(--wb-s2)}
.workbench .cm-kpi .cm-lb{font-size:12px;font-weight:600;color:var(--wb-t2)}
.workbench .cm-kpi .cm-v{font-family:var(--wb-fm);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.05;color:var(--wb-t)}
.workbench .cm-kpi .cm-v small{font-size:13px;font-weight:500;color:var(--wb-t3)}
.workbench .cm-kpi.is-zero .cm-v{color:var(--wb-warn)}
.workbench .cm-kpi .cm-sub{white-space:normal}
.workbench .cm-kpi .wb-chip{justify-self:start;margin-top:4px}
.workbench .cm-list{display:grid;gap:0}
.workbench .cm-li{display:grid;gap:7px;padding:10px 2px;border-bottom:1px solid var(--wb-s3)}
.workbench .cm-li:last-child{border-bottom:0}
.workbench .cm-l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.workbench .cm-l1 b{font-size:13px;color:var(--wb-t)}
.workbench .cm-l1 .cm-pairs{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--wb-t2)}
.workbench .cm-l2{display:flex;align-items:center;gap:8px;white-space:nowrap}
.workbench .cm-l2 .cm-spentr{margin-left:auto;font-size:12px;color:var(--wb-t3)}

/* 丁 · 一台一行 */
.workbench .cm-rows{display:grid}
.workbench .cm-row{display:grid;grid-template-columns:150px 170px 1fr auto;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--wb-s3);white-space:nowrap}
.workbench .cm-row:first-child{border-top:1px solid var(--wb-s3)}
.workbench .cm-row .cm-who{display:flex;align-items:center;gap:8px}
.workbench .cm-row .cm-who b{font-size:13px}
.workbench .cm-row .cm-nums{font-size:12px;color:var(--wb-t2)}
.workbench .cm-row .cm-spentr{font-size:12px;color:var(--wb-t3);text-align:right}
</style>
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <a class="admin-brand" href="#" aria-label="首页"><span class="brand-label">OPERATIONS</span><strong>Plus 运营后台 <span aria-hidden="true">✦</span></strong><small>内部管理中心</small></a>
    <nav aria-label="演示导航">
      <button class="nav-item is-active" type="button"><span class="ic" aria-hidden="true">◱</span>工作台</button>
    </nav>
  </aside>

  <main class="main-area">
    <header class="topbar"><div class="topbar-title"><h1>今天的运行情况</h1></div><span class="sync-time" title="今天花了多少、查询时间这些小字是演示库的">演示页 · 两个钱包、三张卡、直充点数照 09-30 16:0x UTC 的生产</span></header>

    <div class="demo-bar" role="group" aria-label="演示开关">
      <span><b>方案</b></span>
      <span class="opt" data-group="design">
        <button type="button" data-v="now" aria-pressed="false">现在</button>
        <button type="button" data-v="a" aria-pressed="true">甲 · 一张表</button>
        <button type="button" data-v="b" aria-pressed="false">乙 · 每台一块</button>
        <button type="button" data-v="c" aria-pressed="false">丙 · 左数右明细</button>
        <button type="button" data-v="d" aria-pressed="false">丁 · 一台一行</button>
      </span>
      <span><b>情况</b></span>
      <span class="opt" data-group="scene">
        <button type="button" data-v="1" aria-pressed="true">① 现在</button>
        <button type="button" data-v="2" aria-pressed="false">② 钱包 $40</button>
        <button type="button" data-v="3" aria-pressed="false">③ 两单·钱包够</button>
        <button type="button" data-v="4" aria-pressed="false">④ 两单·钱包没充</button>
        <button type="button" data-v="5" aria-pressed="false">⑤ token 失效</button>
        <button type="button" data-v="6" aria-pressed="false">⑥ 总闸关</button>
      </span>
    </div>
    <p class="demo-note" id="demo-note"></p>

    <section class="view workbench"><div class="wb-mid" id="demo-mid"></div></section>
  </main>
</div>

<script>
// 「现在」＝当前 admin.js 在本机演示库渲染的原样 HTML；甲～丁由下面的函数从**同一份后端数据**画出来
// （本机演示库照生产设数 → 真分卡代码派单 → 后端 overview / alerts 原样存下）。页面只做加法，不自己推业务规则。
const NOTES = {
  1: '<b>① 现在</b>（生产 09-30 16:0x UTC）：8499 卡上 $16 够付 1 单；5270 只剩 $0.25；highvcc 钱包 $24.35 扣掉押金 $20 不够补 $16。<b>还能接 1 单</b>。',
  2: '<b>② 钱包充到 $40</b>：(40 − 押金 20) ÷ 16 = 钱包够付 1 单（轮到 5270 时先补 $16）。<b>还能接 2 单</b>。',
  3: '<b>③ 两单同时来、钱包 $40</b>：第 1 单用 8499，第 2 单给 5270 补 $16（真分卡代码派的）。两张卡都在用 → <b>再来一单要等</b>。',
  4: '<b>④ 两单同时来、钱包没充</b>（$24.35）：第 1 单用 8499，第 2 单在等卡——不充钱包时会遇到的样子。',
  5: '<b>⑤ token 失效</b>（钱包 $40）：补钱、开卡都会失败。「钱包够付」写「—」是待批的提议（要后端加一个条件）。',
  6: '<b>⑥ 总闸关</b>（钱包 $40，你已批的 B）：不补钱、不开卡。写在标题行右边，不再每个格子写一遍。'
};
const FAULTS = { CARD_STOCK_PURCHASE_DISABLED: ['暂停开卡', '卡台那边暂停开卡，开不出新卡'] };
let data = null;
const state = { design: 'a', scene: '1' };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (v) => Number(v).toFixed(2);
const hhmm = (v) => (v ? new Date(v).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' }) : '—');
const chip = (tone, text) => `<span class="wb-chip ${tone}"><span class="wb-d"></span>${text}</span>`;
const st = (text, title) => `<span class="cm-st is-danger" title="${esc(title)}"><span class="wb-d"></span>${esc(text)}</span>`;

function model(s) {
  const ov = s.overview;
  const supplyOff = ov.decisions?.cardAutoReplenishmentEnabled === false;
  const tokenBad = (s.tokenAlerts || []).length > 0;
  const rigs = (ov.cardStockByProvider || []).map((p) => {
    const plus = (p.byProduct || []).find((x) => x.productCode === 'plus') || {};
    const usesToken = p.providerKind !== 'hnskj';   // 只有 highvcc 用网页 token（同「更新登录」按钮的判断）
    const marks = [];
    if (p.supplyFaultState && p.supplyFaultState !== 'OK') {
      const [short, long] = FAULTS[p.supplyFaultReason] || ['供卡故障', '开不出新卡'];
      marks.push(st(short, `${long}${p.supplyFaultReason ? `（${p.supplyFaultReason}）` : ''}`));
    }
    if (usesToken && tokenBad) marks.push(st('token 失效', '补钱、开卡都会失败；去卡片页重新贴 token'));
    const wallet = plus.walletOrders == null || (usesToken && tokenBad) ? null : Number(plus.walletOrders);
    const spent = p.spentToday == null ? null : Number(p.spentToday);
    return { p, ready: Number(plus.readyOrders || 0), wallet, usesToken, marks: marks.join(''), spent };
  });
  const ready = rigs.reduce((n, r) => n + r.ready, 0);
  const wallet = rigs.reduce((n, r) => n + (r.wallet || 0), 0);
  const pro = {};
  for (const r of rigs) for (const x of (r.p.byProduct || [])) if (x.productCode !== 'plus') pro[x.label] = (pro[x.label] || 0) + Number(x.readyOrders || 0);
  return { rigs, ready, wallet, total: ready + wallet, waiting: Number(ov.ordersWaitingForCard || 0), supplyOff, zz: ov.zzshuPoints, pro };
}

const tailChip = (m) => (m.waiting > 0 ? chip('warn', `${m.waiting} 单正在等卡`) : m.total === 0 ? chip('mute', '再来一单要等卡') : '');
const offChip = (m) => (m.supplyOff ? `<span title="不补钱、不开新卡；卡上现成的钱照常能付">${chip('warn', '自动开卡总闸关着')}</span>` : '');
const subText = (m) => `<span class="cm-sub">卡上够付 <i>${m.ready}</i> · 钱包够付 <i>${m.wallet}</i></span>`;
const numCell = (v) => (v == null ? '<span class="cm-num is-dim">—</span>' : `<span class="cm-num">${v}</span> <span class="cm-unit">单</span>`);
const walletCell = (r) => {
  const w = r.p.wallet;
  return `<span class="cm-wal"><span class="wb-mono">${w ? '$' + money(w.balance) : '—'}</span><span class="cm-when">${hhmm(w?.observedAt)}</span>`
    + `<button type="button" class="wb-btn out sm">刷新</button>${r.usesToken ? '<button type="button" class="wb-btn out sm">更新登录</button>' : ''}</span>`;
};
const spentText = (r) => (r.spent == null ? '—' : r.spent === 0 ? '<span class="cm-spent0">没花钱</span>' : `<span class="wb-mono">$${money(r.spent)}</span>`);
const foot = (m) => {
  const pro = Object.entries(m.pro).map(([k, v]) => `${esc(k)} 卡上够付 <b>${v}</b> 单`).join(' · ');
  return `<p class="cm-foot"><span>直充平台 剩 <b>${m.zz?.points ?? '—'}</b> 点 · ${hhmm(m.zz?.observedAt)}</span>${pro ? `<span>${pro}</span>` : ''}</p>`;
};
// 标题行：左「Plus 还能接 N 单」，右「卡上够付 · 钱包够付」+ 等卡 / 总闸提示
const header = (m, { withSub = true } = {}) => `<div class="wb-ch cm-ch">
    <div><p class="wb-kick">卡与钱</p><h2 class="cm-title${m.total === 0 ? ' is-zero' : ''}">Plus 还能接 <span class="cm-n">${m.total}</span> 单</h2></div>
    <div class="cm-chr">${withSub ? subText(m) : ''}${offChip(m)}${tailChip(m)}</div>
  </div>`;

function designA(m) {
  const rows = m.rigs.map((r) => `<tr>
      <td class="cm-name"><b>${esc(r.p.label)}</b>${r.marks}</td>
      <td class="r">${numCell(r.ready)}</td>
      <td class="r">${numCell(r.wallet)}</td>
      <td>${walletCell(r)}</td>
      <td class="r">${spentText(r)}</td></tr>`).join('');
  return header(m) + `<div class="wb-cb" id="wb-cards"><div class="wb-tblwrap"><table class="wb-tbl cm-tbl">
      <thead><tr><th>卡台</th><th class="r">卡上够付</th><th class="r">钱包够付</th><th>钱包</th><th class="r">今天花了</th></tr></thead>
      <tbody>${rows}</tbody></table></div>${foot(m)}</div>`;
}
function designB(m) {
  const tiles = m.rigs.map((r) => `<div class="cm-rig">
      <div class="cm-rhead"><b>${esc(r.p.label)}</b>${r.marks}<span class="cm-spentr">今天 ${spentText(r)}</span></div>
      <div class="cm-two"><span>卡上够付<span class="cm-big2">${r.ready}</span>单</span><span>钱包够付${r.wallet == null ? '<span class="cm-big2 is-dim">—</span>' : `<span class="cm-big2">${r.wallet}</span>单`}</span></div>
      <div>${walletCell(r)}</div></div>`).join('');
  return header(m) + `<div class="wb-cb" id="wb-cards"><div class="cm-rigs">${tiles}</div>${foot(m)}</div>`;
}
function designC(m) {
  const items = m.rigs.map((r) => `<div class="cm-li">
      <div class="cm-l1"><b>${esc(r.p.label)}</b>${r.marks}<span class="cm-pairs"><span>卡上够付 ${numCell(r.ready)}</span><span>钱包够付 ${numCell(r.wallet)}</span></span></div>
      <div class="cm-l2">${walletCell(r)}<span class="cm-spentr">今天 ${spentText(r)}</span></div></div>`).join('');
  // 左框窄，「卡上够付 · 钱包够付」拆两行写，免得数字被挤到下一行
  const kpi = `<div class="cm-kpi${m.total === 0 ? ' is-zero' : ''}"><span class="cm-lb">Plus 还能接</span><span class="cm-v">${m.total} <small>单</small></span>`
    + `<span class="cm-sub">卡上够付 <i>${m.ready}</i></span><span class="cm-sub">钱包够付 <i>${m.wallet}</i></span>${offChip(m)}${tailChip(m)}</div>`;
  return `<div class="wb-ch"><div><p class="wb-kick">卡与钱</p><h2>还能接几单</h2></div></div>
    <div class="wb-cb" id="wb-cards"><div class="cm-split">${kpi}<div class="cm-list">${items}</div></div>${foot(m)}</div>`;
}
function designD(m) {
  const rows = m.rigs.map((r) => `<div class="cm-row">
      <span class="cm-who"><b>${esc(r.p.label)}</b>${r.marks}</span>
      <span class="cm-nums">卡上够付 ${numCell(r.ready)} · 钱包够付 ${numCell(r.wallet)}</span>
      ${walletCell(r)}
      <span class="cm-spentr">今天 ${spentText(r)}</span></div>`).join('');
  return header(m, { withSub: false }) + `<div class="wb-cb" id="wb-cards"><div class="cm-rows">${rows}</div>${foot(m)}</div>`;
}

function render() {
  const s = data.scenarios[state.scene];
  const box = document.getElementById('demo-mid');
  box.innerHTML = s.nowHtml.replace(/^<div class="wb-mid">|<\/div>$/g, '');
  const recon = box.querySelector('#wb-recon');
  if (recon) recon.innerHTML = '<p class="demo-muted">（这格这次不改，演示里不接数据）</p>';
  if (state.design !== 'now') {
    const card = box.querySelector('#wb-cards').closest('.wb-card');
    const m = model(s);
    card.innerHTML = { a: designA, b: designB, c: designC, d: designD }[state.design](m);
  }
  document.getElementById('demo-note').innerHTML = NOTES[state.scene]
    + ` <span class="demo-muted">· 现在看的是<b>${{ now: '现在的页面', a: '甲 · 一张表', b: '乙 · 每台一块', c: '丙 · 左数右明细', d: '丁 · 一台一行' }[state.design]}</b>（红字悬停看详情；按钮在演示里不起作用）</span>`;
  for (const g of document.querySelectorAll('.demo-bar .opt')) {
    for (const b of g.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === state[g.dataset.group]));
  }
}

document.addEventListener('click', (event) => {
  const opt = event.target.closest('.demo-bar .opt button');
  if (opt) { state[opt.closest('.opt').dataset.group] = opt.dataset.v; render(); }
});
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (k in state) state[k] = v;
fetch('data/d414-cards-money-demo.json').then((r) => r.json()).then((json) => { data = json; render(); });
</script>
</body>
</html>
