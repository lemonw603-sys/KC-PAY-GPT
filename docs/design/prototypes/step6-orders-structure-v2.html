<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>订单页结构 Demo · 订单与 CDK 联动</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#172b4d;--muted:#687991;--line:#dce5ef;--blue:#2457c5;--blue-soft:#edf3ff;--green:#147a55;--green-soft:#e9f7f0;--amber:#9a6300;--amber-soft:#fff5df;--red:#b42318;--red-soft:#fff0ee;--purple:#6941c6;--purple-soft:#f2edff;--shadow:0 10px 26px rgba(31,57,93,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 12px;cursor:pointer}button:hover{border-color:#9db6dc;background:#f8fbff}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #81a9ef;outline-offset:2px}.demo-banner{padding:15px 24px;background:#102c54;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.demo-banner strong{font-size:15px}.demo-banner span{color:#c9d9f1}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1540px;margin:auto;min-height:calc(100vh - 62px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 16px}.brand{font-weight:700;font-size:16px;margin:0 8px 28px}.nav{display:grid;gap:6px}.nav button{border-color:transparent;text-align:left;background:transparent}.nav button.active{background:var(--blue-soft);border-color:#cbdcff;color:var(--blue);font-weight:700}.main{padding:30px;min-width:0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.head h1{font-size:26px;margin:0 0 3px;letter-spacing:-.02em}.head p{margin:0;color:var(--muted)}.head .demo-actions{display:flex;gap:8px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:#1946a4;color:#fff}.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}.filters input{min-width:280px;flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px}.filter-chip{border-radius:999px;padding:7px 12px;background:#fff}.filter-chip.active{background:var(--blue-soft);color:var(--blue);border-color:#b9cdfb;font-weight:600}.updated{margin-left:auto;color:var(--muted);font-size:12px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.summary-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;min-width:150px}.summary-card strong{display:block;font-size:20px}.summary-card span{color:var(--muted);font-size:12px}.summary-card.alert{border-color:#f2c47b;background:#fffaf0}.table-card{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:14px 15px;border-bottom:1px solid #edf1f5;vertical-align:top}th{background:#f8fafc;color:#667891;font-size:12px;font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}.email-btn,.link-btn{border:0;background:none;color:var(--blue);padding:0;font-weight:650;text-align:left}.email-btn:hover,.link-btn:hover{background:none;text-decoration:underline}.muted{color:var(--muted);font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650;white-space:nowrap}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.success{background:var(--green-soft);color:var(--green)}.status.processing{background:var(--blue-soft);color:var(--blue)}.status.warn{background:var(--amber-soft);color:var(--amber)}.status.danger{background:var(--red-soft);color:var(--red)}.status.neutral{background:#eef2f6;color:#687991}.tag{display:inline-block;border-radius:5px;padding:2px 6px;margin:4px 4px 0 0;background:#f1f4f8;color:#52657d;font-size:11px}.tag.route{background:var(--purple-soft);color:var(--purple)}.tag.card{background:#eef8ff;color:#196a9b}.history-row{background:#fbfcfe}.history-row td{padding:10px 15px 14px 46px}.history-box{border-left:3px solid #cbd6e5;padding-left:12px;color:var(--muted)}.history-box strong{color:var(--ink)}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.detail{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px;scroll-margin-top:18px}.detail.open{display:block}.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.detail-head h2{margin:0;font-size:20px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.fact{border:1px solid #e6edf5;border-radius:9px;padding:11px 12px}.fact label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.fact strong{font-size:14px}.detail-section{margin-top:20px;border-top:1px solid #edf1f5;padding-top:16px}.detail-section h3{font-size:15px;margin:0 0 10px}.cdk-card{background:#f8fbff;border:1px solid #cbdcff;border-radius:10px;padding:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cdk-card code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.timeline{display:grid;gap:9px}.timeline-item{display:grid;grid-template-columns:110px 130px 1fr;gap:10px;align-items:baseline;font-size:13px}.timeline-item time,.timeline-item small{color:var(--muted)}.notice{min-height:26px;margin:12px 0;color:var(--green);font-size:13px}.empty{padding:40px;text-align:center;color:var(--muted)}.footer-note{padding:13px 15px;color:var(--muted);font-size:12px;background:#fbfcfe;border-top:1px solid #edf1f5}@media(max-width:900px){.shell{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px 14px}.head{display:block}.head .demo-actions{margin-top:12px}.updated{margin-left:0}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.demo-banner{padding:13px 15px}.main{padding:16px 10px}.head h1{font-size:23px}.filters input{min-width:100%}.summary-card{flex:1;min-width:120px}.detail-grid{grid-template-columns:1fr}.timeline-item{grid-template-columns:1fr;gap:0}.timeline-item time{margin-top:6px}table{min-width:900px}}
</style>
</head>
<body>
<div class="demo-banner"><strong>订单页结构 Demo · v2</strong><span>纯测试数据，不连接后台、不生成CDK、不触发充值。</span><button id="resetDemo">重置演示</button></div>
<div class="shell">
  <aside class="sidebar"><p class="brand">PLUS OPERATIONS</p><nav class="nav"><button class="active">客户充值</button><button>CDK管理</button><button>卡片与钱包</button><button>诊断</button></nav></aside>
  <main class="main">
    <header class="head"><div><h1>最近客户充值</h1><p>邮箱优先 · 以最新一次提交为主 · 历史失败收在展开区</p></div><div class="demo-actions"><button id="toggleCdk">查看对应CDK</button><button class="primary" id="refresh">刷新演示数据</button></div></header>
    <section class="filters" aria-label="订单筛选"><input id="search" type="search" placeholder="搜索客户邮箱、CDK或订单查询码" aria-label="搜索客户邮箱、CDK或订单查询码"><button class="filter-chip active" data-filter="ALL">全部</button><button class="filter-chip" data-filter="ACTION">需要我处理</button><button class="filter-chip" data-filter="PROCESSING">处理中</button><button class="filter-chip" data-filter="SUCCESS">已成功</button><button class="filter-chip" data-filter="FAILED">失败/可重提</button><span class="updated">刚刚更新 · 北京时间</span></section>
    <section class="summary" aria-label="摘要"><div class="summary-card"><strong id="countRecent">6</strong><span>最近记录</span></div><div class="summary-card"><strong id="countProcessing">2</strong><span>处理中</span></div><div class="summary-card"><strong id="countSuccess">2</strong><span>已成功</span></div><div class="summary-card alert"><strong id="countAction">2</strong><span>需要我处理</span></div></section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section class="table-card"><div class="table-scroll"><table><thead><tr><th>充值邮箱 / 产品</th><th>充值结果</th><th>当前阶段</th><th>提交时间</th><th>成功时间</th><th>充值方式</th><th>付款卡</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer-note">主状态看充值结果；“CDK已兑换”不等于充值成功。付款结果待核实单不得重复充值。</div></section>
    <section id="detail" class="detail" tabindex="-1"></section>
  </main>
</div>
<script>
const initial=[
 {id:'a',email:'lin@example.test',plan:'Plus',code:'PLUS-7Q2K4-9MNPX-4H8TW-2R6VC',result:'SUCCESS',resultLabel:'充值成功',stage:'已完成',created:'09-22 10:20',success:'09-22 10:23',route:'API',provider:'HNSKJ',card:'6754',cdk:'已成功使用',history:[{time:'09-22 10:15',result:'付款前失败',reason:'未产生付款证据，CDK已退回后重提'}]},
 {id:'b',email:'chen@example.test',plan:'Plus',code:'PLUS-3KM2P-8VQRT-6N7XA-5JH9C',result:'PROCESSING',resultLabel:'处理中',stage:'填写结账信息',created:'09-22 10:18',success:'—',route:'Browser',provider:'备用卡台A',card:'8718',cdk:'已兑换',history:[]},
 {id:'c',email:'zhou@example.test',plan:'Plus',code:'PLUS-9HT4P-2FQ8M-7KX3A-6NVC5',result:'ACTION',resultLabel:'需要客户补Session',stage:'等待客户补资料',created:'09-22 10:12',success:'—',route:'Browser',provider:'备用卡台A',card:'4022',cdk:'已兑换',history:[]},
 {id:'d',email:'wang@example.test',plan:'Plus',code:'PLUS-5P7KD-3M8QX-9HT2A-4VC6N',result:'UNKNOWN',resultLabel:'付款结果待核实',stage:'等待人工核对',created:'09-22 10:08',success:'—',route:'API',provider:'HNSKJ',card:'0577',cdk:'已兑换',history:[]},
 {id:'e',email:'mei@example.test',plan:'Plus',code:'PLUS-6R8VX-2KQ4M-7HT9P-3NC5A',result:'SUCCESS',resultLabel:'充值成功',stage:'已完成',created:'09-22 09:54',success:'09-22 09:58',route:'API',provider:'HNSKJ',card:'5622',cdk:'已成功使用',history:[]},
 {id:'f',email:'gao@example.test',plan:'Plus',code:'PLUS-8N3QM-5VC7K-2HT4P-9RX6A',result:'FAILED',resultLabel:'失败 · 可重提',stage:'等待客户重新提交',created:'09-22 09:41',success:'—',route:'API',provider:'—',card:'待分配',cdk:'已退回可重提',history:[{time:'09-22 09:40',result:'付款前失败',reason:'卡片未分配，未产生付款'}]}
];
let data=structuredClone(initial),filter='ALL',query='',detailId=null,showCdkOnly=false,expanded=new Set();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=(r)=>{if(r.result==='SUCCESS')return '<span class="status success">充值成功</span>';if(r.result==='PROCESSING')return '<span class="status processing">处理中</span>';if(r.result==='UNKNOWN')return '<span class="status danger">付款结果待核实</span>';if(r.result==='ACTION')return '<span class="status warn">需要客户补资料</span>';return '<span class="status neutral">失败 · 可重提</span>'};
function visible(){return data.filter(r=>{const f=filter==='ALL'||(filter==='ACTION'&&(r.result==='ACTION'||r.result==='UNKNOWN'))||filter===r.result;const q=`${r.email} ${r.code} ${r.plan}`.toLowerCase().includes(query.toLowerCase());return f&&q})}
function render(){
 const rows=visible(); $('#rows').innerHTML=rows.length?rows.map(r=>`<tr>
  <td><button class="email-btn" data-open="${r.id}">${esc(r.email)}</button><div class="muted">${esc(r.plan)} · CDK ${esc(r.cdk)}</div></td>
  <td>${status(r)}${r.history.length?`<div class="muted">历史重提 ${r.history.length} 次</div>`:''}</td>
  <td><strong>${esc(r.stage)}</strong>${r.result==='UNKNOWN'?'<div class="muted">先核实，不重复充值</div>':''}</td>
  <td>${esc(r.created)}</td><td>${esc(r.success)}</td>
  <td><span class="tag route">${esc(r.route)}</span></td>
  <td><span class="tag card">${esc(r.provider)}</span><div class="muted">${esc(r.card)}</div></td>
  <td><div class="row-actions"><button class="link-btn" data-open="${r.id}">看详情</button>${r.history.length?`<button class="link-btn" data-history="${r.id}">${expanded.has(r.id)?'收起历史':'展开历史'}</button>`:''}</div></td></tr>${expanded.has(r.id)?`<tr class="history-row"><td colspan="8"><div class="history-box"><strong>同CDK历史记录（${r.history.length}次）</strong>${r.history.map(h=>`<p><strong>${esc(h.time)} · ${esc(h.result)}</strong><br>${esc(h.reason)}</p>`).join('')}</div></td></tr>`:''}`).join(''):'<tr><td colspan="8"><div class="empty">没有符合条件的记录</div></td></tr>';
 document.querySelectorAll('.filter-chip').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
 $('#countRecent').textContent=data.length;$('#countProcessing').textContent=data.filter(r=>r.result==='PROCESSING').length;$('#countSuccess').textContent=data.filter(r=>r.result==='SUCCESS').length;$('#countAction').textContent=data.filter(r=>['ACTION','UNKNOWN'].includes(r.result)).length;
 if(detailId) openDetail(detailId,true); else $('#detail').classList.remove('open');
}
function openDetail(id,keep=false){const r=data.find(x=>x.id===id);if(!r)return;detailId=id;$('#detail').classList.add('open');$('#detail').innerHTML=`<div class="detail-head"><div><h2>${esc(r.email)} · ${esc(r.plan)}</h2><div style="margin-top:7px">${status(r)} <span class="tag route">${esc(r.route)}</span><span class="tag card">${esc(r.provider)}</span></div></div><button id="closeDetail">收起</button></div>
 <div class="detail-grid"><div class="fact"><label>提交时间</label><strong>${esc(r.created)}</strong></div><div class="fact"><label>充值成功时间</label><strong>${esc(r.success)}</strong></div><div class="fact"><label>当前阶段</label><strong>${esc(r.stage)}</strong></div><div class="fact"><label>付款卡</label><strong>${esc(r.card)}</strong></div><div class="fact"><label>CDK状态</label><strong>${esc(r.cdk)}</strong></div><div class="fact"><label>安全提示</label><strong>${r.result==='UNKNOWN'?'不可重复充值':'付款未知保护未触发'}</strong></div></div>
 <div class="detail-section"><h3>本单CDK</h3><div class="cdk-card"><code>${esc(r.code)}</code><button data-copy="${r.id}">复制CDK</button><button id="locateCdk">在CDK页定位</button></div></div>
 <div class="detail-section"><h3>执行步骤</h3><div class="timeline"><div class="timeline-item"><time>${esc(r.created)}</time><strong>收到客户提交</strong><small>CDK已兑换，订单已建立</small></div><div class="timeline-item"><time>随后</time><strong>${esc(r.stage)}</strong><small>只展示已有系统证据，不虚构内部步骤</small></div>${r.result==='SUCCESS'?`<div class="timeline-item"><time>${esc(r.success)}</time><strong>充值成功</strong><small>目标套餐确认完成</small></div>`:''}</div></div>
 ${r.history.length?`<div class="detail-section"><h3>同CDK历史记录</h3><div class="history-box">${r.history.map(h=>`<p><strong>${esc(h.time)} · ${esc(h.result)}</strong><br>${esc(h.reason)}</p>`).join('')}</div></div>`:''}
 <div class="detail-section"><div class="row-actions"><button id="locateOrder" class="primary">在订单列表保持定位</button><span class="muted">Demo按钮只改变页面，不调用接口。</span></div></div>`;if(!keep){$('#detail').scrollIntoView({behavior:'smooth',block:'start'});$('#detail').focus({preventScroll:true})}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.open){openDetail(b.dataset.open);return}if(b.dataset.history){const id=b.dataset.history;expanded.has(id)?expanded.delete(id):expanded.add(id);render();return}if(b.id==='closeDetail'){detailId=null;$('#detail').classList.remove('open');return}if(b.id==='refresh'){render();$('#notice').textContent='已刷新演示数据；正式系统会从服务端重新读取。';return}if(b.id==='resetDemo'){data=structuredClone(initial);filter='ALL';query='';detailId=null;expanded.clear();render();$('#notice').textContent='已重置演示数据。';return}if(b.id==='toggleCdk'){showCdkOnly=!showCdkOnly;$('#notice').textContent=showCdkOnly?'演示：已切换到对应CDK定位视图，正式系统会跳转CDK页并保留批次筛选。':'演示：订单页仍是当前主视图。';return}if(b.dataset.copy){try{await navigator.clipboard.writeText(data.find(r=>r.id===b.dataset.copy).code);$('#notice').textContent='已复制测试CDK；正式系统复制失败时保留手动复制入口。'}catch{$('#notice').textContent='浏览器不允许自动复制，请在详情中手动复制。'}return}if(b.id==='locateCdk'){$('#notice').textContent='演示：将跳转到CDK页，并按这张码定位；不会把CDK管理控件塞进订单页。';return}if(b.id==='locateOrder'){$('#notice').textContent='已回到订单列表，当前详情仍保持可追踪。';return}});
$('#search').addEventListener('input',e=>{query=e.target.value;render()});render();
</script>
</body></html>
