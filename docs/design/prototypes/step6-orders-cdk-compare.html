<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"><title>订单与CDK · 可点击对比</title>
<style>
:root{--bg:#f4f8f6;--paper:#fff;--ink:#18342c;--muted:#536b62;--line:#d9e5df;--green:#12694c;--soft:#e8f3ed;--amber:#845500}*{box-sizing:border-box}body{margin:0;font:14px/1.6 "PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:8px 13px}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #268661;outline-offset:3px}button[aria-pressed=true],.primary{background:var(--green);color:white;border-color:var(--green)}input,select{border:1px solid var(--line);border-radius:8px;padding:9px;background:white;color:var(--ink)}input{width:min(330px,100%)}small{display:block;color:var(--muted);font-size:12px}.compare{padding:18px 26px;background:white;border-bottom:1px solid var(--line)}.compare h1{font-size:19px;margin:0 0 10px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.compare p{margin:10px 0 0;color:var(--muted)}.shell{display:grid;grid-template-columns:170px minmax(0,1fr);max-width:1500px;margin:auto;min-height:75vh}aside{padding:28px 18px;border-right:1px solid var(--line)}aside strong{display:block;margin-bottom:25px}nav{display:grid;gap:10px}nav button{text-align:left}main{padding:30px;min-width:0}h2{font-size:26px;margin:0 0 6px}h3{margin:18px 0 8px;font-size:17px}.subtitle{color:var(--muted);margin:0 0 22px}.tabs{display:flex;gap:8px;margin-bottom:22px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.filter{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:var(--bg);font-weight:500;color:var(--muted)}th,td{padding:15px 17px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}.email{border:0;background:none;color:var(--ink);font-weight:600;padding:0;text-align:left}.badge{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--soft);color:var(--green)}.warn{background:#fff2d9;color:var(--amber)}.quiet{background:#edf1ef;color:var(--muted)}.history{margin:7px 0 0;color:var(--muted)}summary{cursor:pointer}.history p{white-space:normal;max-width:290px}.foot{padding:12px 17px;color:var(--muted);font-size:12px}.detail{margin-top:20px;padding:22px;background:white;border:1px solid var(--line);border-radius:12px;scroll-margin-top:15px}.detail h2{font-size:20px;overflow-wrap:anywhere}.detail dl{display:grid;grid-template-columns:130px 1fr;gap:10px;margin:20px 0}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.detail code{font-family:ui-monospace,monospace}.detail .tools{justify-content:space-between}.generate{padding:20px;border-bottom:1px solid var(--line)}.generate label{display:grid;gap:4px}.notice{margin-top:12px;color:var(--green)}#notice{min-height:26px;margin-top:10px}#detail:empty{display:none}.mock{font-size:12px;color:var(--muted)}::selection{background:#c4e9d6}button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:700px){.compare{padding:16px}.shell{display:block}aside{padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}aside strong{display:none}nav{display:flex;flex-wrap:wrap}main{padding:20px 12px}h2{font-size:23px}th,td{padding:12px}.detail{padding:16px}.detail dl{grid-template-columns:95px 1fr}.mock{width:100%}}
</style></head><body>
<header class="compare"><h1>订单与CDK：试试哪种更顺手</h1><div class="tools"><button data-mode="A" aria-pressed="true">A · 两页联动</button><button data-mode="B" aria-pressed="false">B · 同页分区</button><button id="reset">重置演示</button><span class="mock">纯演示 · 全是假数据 · 不会生成真实卡密或充值</span></div><p id="explain"></p><details><summary>可以试这四件事</summary><p>看最近充值 → 点邮箱查看对应CDK → 展开林同学的历史失败 → 生成测试码并模拟客户兑换。切换A/B后数据保留，方便比较。</p></details></header>
<div class="shell"><aside><strong>充值管理</strong><nav id="nav"></nav></aside><main><div id="tabs"></div><h2 id="heading"></h2><p class="subtitle" id="sub"></p><div id="content"></div><div id="notice" role="status" aria-live="polite"></div><section id="detail" tabindex="-1"></section></main></div>
<script>
const seed=()=>[
{id:1,email:'lin@example.test',code:'DEMO-PLUS-LIN-001',step:'充值成功',time:'09-22 10:20',done:'09-22 10:23',card:'6754',provider:'HNSKJ',method:'API',history:true},
{id:2,email:'chen@example.test',code:'DEMO-PLUS-CHEN-002',step:'填写结账信息',time:'09-22 10:18',done:'',card:'8718',provider:'highvcc',method:'Browser'},
{id:3,email:'zhou@example.test',code:'DEMO-PLUS-ZHOU-003',step:'等客户重贴Session',time:'09-22 10:12',done:'',card:'4022',provider:'highvcc',method:'Browser'},
{id:4,email:'wang@example.test',code:'DEMO-PLUS-WANG-004',step:'付款结果待核实',time:'09-22 10:08',done:'',card:'0577',provider:'HNSKJ',method:'API'},
{id:5,email:'',code:'DEMO-PLUS-RESERVE-005',step:'未提交兑换',time:'',done:'',card:'',provider:'',method:''}];
let rows=seed(),mode='A',view='orders',query='',picked=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=r=>`<span class="badge ${r.step.includes('等')||r.step.includes('待核实')?'warn':!r.email?'quiet':''}">${r.step}</span>`;
function notice(t){$('notice').textContent=t}
function render(){
document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
$('explain').textContent=mode==='A'?'两个侧栏入口：发码去CDK页，看充值去订单页；关联信息在详情直接查看。':'一个侧栏入口：在同一页面切换充值记录与发码管理；不把两张完整表上下堆叠。';
$('nav').innerHTML=mode==='A'?`<button data-view="orders" aria-pressed="${view==='orders'}">订单</button><button data-view="cdks" aria-pressed="${view==='cdks'}">CDK</button>`:'<button aria-pressed="true" data-view="orders">订单与CDK</button>';
$('tabs').innerHTML=mode==='B'?`<div class="tabs"><button data-view="orders" aria-pressed="${view==='orders'}">充值记录</button><button data-view="cdks" aria-pressed="${view==='cdks'}">发码与管理</button></div>`:'';
$('heading').textContent=view==='orders'?'最近充值':'发码与管理';$('sub').textContent=view==='orders'?'以客户邮箱看最新进展；同一码之前的失败收在历史里。':'生成、复制后即可发给客户；有空时再看兑换进展。';
$('content').innerHTML=`<div class="panel">${view==='cdks'?'<form class="generate" id="generate"><div class="tools"><label>产品<select><option>Plus</option></select></label><label>有效期<select><option>30天</option></select></label><button class="primary" type="submit">生成一张测试码</button></div><small>本稿只演示单张发码和联动，不改变正式CDK页已定功能。</small></form>':''}<div class="filter"><label for="search">搜索</label><input id="search" placeholder="邮箱或CDK" value="${esc(query)}"><span class="mock">示例时间：2026-09-22，北京时间</span></div><div class="scroll"><table><thead>${view==='orders'?'<tr><th>充值邮箱 / 产品</th><th>最新进度</th><th>卡台 / 卡尾号</th><th>方式</th><th>时间</th></tr>':'<tr><th>CDK / 有效期</th><th>兑换进展</th><th>充值邮箱</th><th>操作</th></tr>'}</thead><tbody id="body"></tbody></table></div><div class="foot">手机可左右滑动表格；详情在下方展开。本次仅比较入口与联动，不含真实支付控制。</div></div>`;
paintRows();$('search').oninput=e=>{query=e.target.value;paintRows()};if($('generate'))$('generate').onsubmit=e=>{e.preventDefault();const id=Math.max(...rows.map(r=>r.id))+1;rows.unshift({id,email:'',code:'DEMO-PLUS-NEW-'+String(id).padStart(3,'0'),step:'未提交兑换',time:'',done:'',card:'',provider:'',method:''});query='';render();openDetail(id);notice('已生成测试码，可复制；下面可模拟客户兑换。')};
if(picked)detailBody();else $('detail').innerHTML='';
}
function paintRows(){const filtered=rows.filter(r=>(view==='cdks'||r.email)&&`${r.email} ${r.code}`.toLowerCase().includes(query.toLowerCase()));$('body').innerHTML=filtered.map(r=>view==='orders'?`<tr><td><button class="email" data-detail="${r.id}">${esc(r.email)}</button><small>Plus</small></td><td>${badge(r)}${r.history?'<details class="history"><summary>之前失败 1 次</summary><p>09-22 10:15 · 未付款失败<br>lin@example.test · HNSKJ 尾号6754 · API<br>本次成功：09-22 10:23</p></details>':''}${r.step.includes('待核实')?'<small>先核对结果，不要重复充值</small>':''}</td><td>${r.provider}<small>尾号 ${r.card}</small></td><td>${r.method}</td><td>提交 ${r.time}<small>${r.done?'成功 '+r.done:'尚未成功'}</small></td></tr>`:`<tr><td><button class="email" data-detail="${r.id}">${r.code}</button><small>Plus · 有效至 10-22</small></td><td>${badge(r)}</td><td>${r.email||'尚未提交账号'}</td><td><button data-copy="${r.id}">复制测试码</button> <button data-detail="${r.id}">${r.email?'看充值详情':'查看测试码'}</button></td></tr>`).join('')||`<tr><td colspan="5">没有匹配记录，请换个邮箱或CDK。</td></tr>`}
function detailBody(){const r=rows.find(x=>x.id===picked);$('detail').className='detail';$('detail').innerHTML=`<div class="tools"><h2>${r.email?esc(r.email):'测试码详情'}</h2><button id="close">收起详情</button></div><dl><dt>充值结果 / 进度</dt><dd>${badge(r)}</dd><dt>对应CDK</dt><dd><code>${r.code}</code> <button data-copy="${r.id}">复制测试码</button></dd><dt>提交时间</dt><dd>${r.time||'尚未提交'}</dd><dt>充值成功时间</dt><dd>${r.done||'尚未成功'}</dd><dt>付款卡</dt><dd>${r.provider?r.provider+' · 尾号 '+r.card:'尚未分配'}</dd><dt>充值方式</dt><dd>${r.method||'尚未确定'}</dd></dl>${r.history?'<details><summary>查看之前的失败记录（1次）</summary><p>09-22 10:15 · lin@example.test · API<br>HNSKJ 尾号6754 · 未付款失败，之后使用同一码重新提交。</p></details>':''}<div class="tools"><button data-related="${r.id}">${view==='orders'?'在CDK列表定位这张码':'在充值列表定位这笔充值'}</button>${!r.email?`<button class="primary" data-simulate="${r.id}">模拟客户已兑换</button>`:''}</div><small>模拟按钮直接填入假结果，不会调用任何接口或产生付款。</small>`;$('close').onclick=()=>{picked=null;render()}}
function openDetail(id){picked=id;detailBody();$('detail').scrollIntoView({behavior:'auto',block:'start'});$('detail').focus({preventScroll:true})}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;render()}if(b.dataset.view){view=b.dataset.view;query='';picked=null;render()}if(b.dataset.detail)openDetail(Number(b.dataset.detail));if(b.dataset.copy){const r=rows.find(x=>x.id===Number(b.dataset.copy));try{await navigator.clipboard.writeText(r.code);notice('已复制测试码：'+r.code)}catch{notice('无法自动复制，请在详情选中测试码手动复制。')}}if(b.dataset.related){const r=rows.find(x=>x.id===Number(b.dataset.related));if(!r.email&&view==='cdks'){notice('这张码尚未提交兑换，因此还没有充值记录。');return}view=view==='orders'?'cdks':'orders';query=r.code;picked=null;render();window.scrollTo(0,0)}if(b.dataset.simulate){const r=rows.find(x=>x.id===Number(b.dataset.simulate));Object.assign(r,{email:'demo'+r.id+'@example.test',step:'充值成功',time:'09-22 10:30',done:'09-22 10:33',provider:'HNSKJ',card:'6754',method:'API'});render();notice('模拟完成：测试邮箱已充值成功，可切换到充值记录查看。')}});
$('reset').onclick=()=>{rows=seed();query='';picked=null;view='orders';render();notice('演示数据已重置。')};render();
</script></body></html>
